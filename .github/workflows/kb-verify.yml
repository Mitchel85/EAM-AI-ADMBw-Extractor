name: KB Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python3 -m pip install jsonschema
      - name: Verify KB, prompt and example
        run: python3 checks/verify.py
